[workspace]
resolver = "2"
members = ["crates/llevant", "crates/llevant-scene", "crates/llevant-render", "crates/llevant-cli", "crates/llevant-gpu", "crates/llevant-py", "crates/llevant-viewer", "crates/llevant-openmc", "crates/llevant-tripoli", "crates/llevant-dragon", "tools/mcnp-oracle", "tools/bench"]
# The MCNP oracle needs a local MCNP install and the GPU renderer a GPU (and wgpu
# builds slowly), so keep them out of the default set:
# `cargo test` / `cargo clippy` stay self-contained. The CLI is light and in it.
default-members = ["crates/llevant-openmc", "crates/llevant-tripoli", "crates/llevant-dragon", "crates/llevant", "crates/llevant-scene", "crates/llevant-render", "crates/llevant-cli"]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.95"
license = "EUPL-1.2"
authors = ["Alvaro Cubi"]
repository = "https://github.com/Fusion4Energy/llevant"
homepage = "https://fusion4energy.github.io/llevant/"
readme = "README.md"

[workspace.dependencies]
# Mesh geometry and tally files (meshtal, MCTAL), from aci-tallies.
aci-tallies = "0.1.0"
aci-tallies-geom = { version = "0.1.0", default-features = false }
blake3 = "1.8"
# The workspace's own crates: published together, at the workspace's version.
llevant = { version = "0.1.0", path = "crates/llevant" }
llevant-cli = { version = "0.1.0", path = "crates/llevant-cli" }
llevant-dragon = { version = "0.1.0", path = "crates/llevant-dragon" }
llevant-gpu = { version = "0.1.0", path = "crates/llevant-gpu" }
llevant-openmc = { version = "0.1.0", path = "crates/llevant-openmc" }
llevant-render = { version = "0.1.0", path = "crates/llevant-render" }
llevant-scene = { version = "0.1.0", path = "crates/llevant-scene" }
llevant-tripoli = { version = "0.1.0", path = "crates/llevant-tripoli" }
llevant-viewer = { version = "0.1.0", path = "crates/llevant-viewer" }
log = "0.4"
# Label rules search all labels as one buffer (llevant-scene).
memchr = "2"
# Cache entries are read from a memory map (llevant-scene).
memmap2 = "0.9"
# Global allocator of the binaries and the Python module: the system heap on
# Windows stops large parallel batches scaling (docs/decisions/0009-mimalloc.md).
mimalloc = { version = "0.1", default-features = false }
# The MCNP parser, pinned exactly: what it parses is part of the engine build
# (`llevant::ENGINE_HASH`, which keys the cache of compiled models), so a new
# parser comes with a new llevant release. migjorn-syntax is pinned with it.
migjorn = "=0.4.0"
migjorn-syntax = "=0.4.0"
rayon = "1"
rustc-hash = "2"

# Tests, benchmarks and day-to-day builds: optimised, but quick to rebuild.
[profile.release]
opt-level = 3
# Never `panic = "abort"`: the Python bindings need panics to unwind.
panic = "unwind"

# What is shipped (binaries, wheels) and what published numbers are measured on.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.bench]
debug = true

[workspace.lints.clippy]
# Index loops over x, y, z read better than iterator chains in the geometry code.
needless_range_loop = "allow"
# `!(lo <= hi)` is deliberate: it is also true when either side is NaN.
neg_cmp_op_on_partial_ord = "allow"
