name: Release

# A push to main whose Cargo.toml version has no tag yet is a release (the version
# is raised with `tools/release.sh X.Y.Z`; nobody types a tag). This builds the
# `llevant` command (with the GPU renderer and `llevant view`) and `llevant-viewer`
# for Windows and Linux, and the abi3 Python wheels (with the GPU and the viewer,
# for `python -m llevant view`), all with the `dist` profile, and tests the wheels;
# then, after an approval on the `release` environment, the crates go to crates.io
# and the wheels and the sdist to PyPI, and the GitHub release (notes generated
# from the commits) creates the tag `vX.Y.Z` on the commit built. Nothing is
# published unless every build passed. Pushes that keep a released version do
# nothing; run by hand (Actions, "Release", "Run workflow"), it only builds.
#
# Publishing needs, once (docs/CONTRIBUTING.md, "Releases"):
# - a GitHub environment `release` (reviewers on it make each publish wait for an
#   approval);
# - the secret CARGO_REGISTRY_TOKEN in it: a crates.io token with publish-new and
#   publish-update scopes;
# - PyPI trusted publishing for project `llevant`: this repository, workflow
#   `release.yml`, environment `release` (a pending publisher before the first
#   release). No PyPI token is stored.

on:
  # Every push to main: `check` takes a few seconds and stops there unless the
  # version is new.
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; a release in progress is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The version, and whether this run releases it: a push to main of a version
  # with no tag yet.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from Cargo.toml, and whether it is new
        id: version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "::error::no version in [workspace.package]"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_REPOSITORY" = "Fusion4Energy/llevant" ]; then
            echo "::notice::releasing v$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "skipping automatic crates.io/PyPI release on fork ($GITHUB_REPOSITORY); use workflow_dispatch to build artifacts"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is not released yet; a run by hand only builds it"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  binaries-windows:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - shell: bash
        run: |
          cargo build --profile dist -p llevant-cli -p llevant-viewer \
            --features llevant-cli/gpu,llevant-cli/viewer
          out="llevant-v${VERSION}-windows-x86_64"
          mkdir "$out"
          cp target/dist/llevant.exe target/dist/llevant-viewer.exe README.md LICENSE* "$out"/
          7z a "$out.zip" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-x86_64
          path: llevant-*.zip

  # Built in the manylinux_2_28 image (AlmaLinux 8, glibc 2.28), as the wheels are,
  # so that the programs run on RHEL 8 and later and Ubuntu 20.04 and later, not
  # only on systems as recent as the runner.
  binaries-linux:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: The viewer's system libraries
        run: dnf install -y libxkbcommon-devel wayland-devel gtk3-devel openssl-devel pkgconf-pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: |
          cargo build --profile dist -p llevant-cli -p llevant-viewer \
            --features llevant-cli/gpu,llevant-cli/viewer
      - name: The programs need glibc 2.28 at most
        shell: bash
        run: |
          for exe in target/dist/llevant target/dist/llevant-viewer; do
            need=$(objdump -T "$exe" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "$exe needs glibc $need"
            [ "$(printf '%s\n2.28\n' "$need" | sort -V | tail -1)" = 2.28 ] ||
              { echo "::error::$exe needs glibc $need, more than 2.28"; exit 1; }
          done
      - name: Package
        shell: bash
        run: |
          out="llevant-v${VERSION}-linux-x86_64"
          mkdir "$out"
          cp target/dist/llevant target/dist/llevant-viewer README.md LICENSE* "$out"/
          tar czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-x86_64
          path: llevant-*.tar.gz

  wheels:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, manylinux: "off" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/llevant-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # The viewer's system libraries, in the manylinux container.
          before-script-linux: |
            dnf install -y libxkbcommon-devel wayland-devel gtk3-devel openssl-devel pkgconf-pkg-config
          args: --profile dist --out dist
      - name: The wheel installs and answers
        working-directory: crates/llevant-py
        shell: bash
        run: |
          python -m pip install dist/*.whl pytest pytest-timeout mypy
          # One line per test, and a test that hangs fails with its stack.
          python -m pytest tests -x -v --timeout 600
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: crates/llevant-py/dist/*.whl

  sdist:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/llevant-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/llevant-py/dist/*.tar.gz

  # The crates, in dependency order (llevant, -scene, -render, -gpu, -viewer,
  # -cli): cargo packages and builds every one from its package before
  # uploading any. A run that fails part-way leaves the uploaded ones published:
  # publish the rest by hand (`cargo publish -p <crate>`), never the same version
  # twice.
  crates:
    needs: [check, binaries-windows, binaries-linux, wheels, sdist]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked --exclude llevant-py --exclude llevant-bench --exclude mcnp-oracle

  pypi:
    needs: [check, binaries-windows, binaries-linux, wheels, sdist]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "wheel-*", path: dist, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: sdist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The GitHub release, after both registries: it creates the tag vX.Y.Z on the
  # commit that was built, so a tag means the version is out.
  release:
    needs: [check, crates, pypi]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: assets/*
          generate_release_notes: true
