name: OpenMC Integration

on:
  pull_request:
    paths:
      - 'crates/llevant-openmc/**'
      - 'crates/llevant/tests/openmc.rs'
      - 'docs/examples/openmc/**'
  push:
    branches: [feature/openmc-integration]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run llevant-openmc unit tests
        run: cargo test --release -p llevant-openmc
      - name: Run llevant OpenMC XML integration tests
        run: cargo test --release -p llevant --test openmc
